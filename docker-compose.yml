services:
  server:
    build:
      context: .
      target: server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NARRATIVE_SERVER_HOST: 0.0.0.0
      NARRATIVE_SERVER_PORT: 4317
      NARRATIVE_DATA_DIR: /app/data
      NARRATIVE_BACKUP_DIR: /app/backups
      NARRATIVE_ALLOW_REMOTE: "true"
      NARRATIVE_AUTH_TOKEN: ${NARRATIVE_AUTH_TOKEN:-local-compose-token-change-me-24}
    env_file:
      - path: .env.local
        required: false
    volumes:
      - narralume-data:/app/data
      - ${NARRATIVE_BACKUP_HOST_DIR:-./data/backups}:/app/backups
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4317/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${NARRATIVE_WEB_BIND_HOST:-127.0.0.1}:4318:80"
    environment:
      NARRATIVE_AUTH_TOKEN: ${NARRATIVE_AUTH_TOKEN:-local-compose-token-change-me-24}

volumes:
  narralume-data:
